name: ci
on:
  # The badge reports the latest run on the default branch, so main has to run
  # on push as well. Scoped to main: an unscoped push trigger would run a second
  # time for every pull request opened from a branch in this repository.
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    name: tests
    strategy:
      matrix:
        # Quoted: unquoted 3.10 would be read as the number 3.1
        python-version: ["3.12"]
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          uv sync --extra dev
      - name: Run tests
        run: |
          make tests
