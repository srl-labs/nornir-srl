[project]
name = "nornir-srl"
# version = "0.7.0"
dynamic = ["version"]
description = "Nornir connection plugin for SRLinux"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Walter De Smedt", email = "walter.de.smedt@gmail.com" },
    { name = "Florian Schwarz" }
]
dependencies = [
    "nornir>=3.5.0",
    "nornir-utils>=0.2.0",
    "pygnmi>=0.8.15",
    "nornir-jinja2>=0.2.0",
    "nornir-scrapli>=2025.1.30",
    "rich>=12.6.0",
    "natsort>=8.4.0",
    "jsondiff>=2.2.1",
    "click>=8.1.3",
    "jmespath>=1.0.1",
    "setuptools>=75.4.0",
    "pyyaml>=6.0.2",
    "typer>=0.16.0",
    "mcp[cli]>=1.9.0,<2",
    "starlette>=0.37.0",
    "openai>=1.40.0",
    "anthropic>=0.40.0",
]

[tool.setuptools.packages.find]
include = ["nornir_srl*"]

[tool.setuptools.package-data]
"nornir_srl.server" = ["static/*"]

[tool.setuptools_scm]
version_file = "nornir_srl/_version.py"

[project.optional-dependencies]
dev = [
    "pytest>=5.2",
    "blessings>=1.7",
]

[project.scripts]
fcli = "nornir_srl.cli:app"
fcli-mcp = "nornir_srl.mcp_server:main"

[project.entry-points."nornir.plugins.connections"]
srlinux = "nornir_srl.connections.srlinux:SrLinux"

[build-system]
requires = ["setuptools>=75.0.0", "setuptools-scm>=8.4.2"]
build-backend = "setuptools.build_meta"

